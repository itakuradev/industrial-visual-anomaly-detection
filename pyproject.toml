[project]
name = "industrial-visual-anomaly-detection"
version = "0.1.0"
description = "PoC of industrial visual anomaly detection with OpenCV preprocessing and Anomalib PatchCore"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anomalib>=2.6.2,<2.7",
    "lightning>=2.6",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "torch>=2.9",
    "torchvision>=0.24",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "anomaly_detection"

# RTX 50系（Blackwell）はcu126ビルドが非対応のため、anomalibが公式extraで提供するcu130を使う。
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
